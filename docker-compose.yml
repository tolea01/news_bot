services:
  app:
    build: .
    container_name: news_bot
    depends_on: 
      - postgres
    ports:
      - "3000:3000"
    networks:
      - news_bot_network
    env_file:
      - .env
    
  postgres:
    image: postgres:17.1
    ports:
      - "5555:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - news_bot_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "7777:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PASSWORD}
    networks:
      - news_bot_network

networks:
  news_bot_network:
    driver: bridge

volumes:
  postgres_data: