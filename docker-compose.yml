services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_bot
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - news_bot_network
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:17.1
    container_name: news_bot_postgres
    ports:
      - "5555:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - news_bot_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: news_bot_pgadmin
    ports:
      - "7777:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PASSWORD}
    networks:
      - news_bot_network
    depends_on:
      - postgres
    restart: unless-stopped

networks:
  news_bot_network:
    driver: bridge

volumes:
  postgres_data:
